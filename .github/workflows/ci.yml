name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        cache-dependency-path: './Backend/package-lock.json'

    - name: Install Dependencies
      working-directory: ./Backend
      run: npm ci

    - name: Typecheck
      working-directory: ./Backend
      run: npm run typecheck

    - name: Lint
      working-directory: ./Backend
      run: npm run lint

    - name: Build
      working-directory: ./Backend
      run: npm run build

    - name: Test
      working-directory: ./Backend
      run: npm test

    - name: Audit
      working-directory: ./Backend
      run: npm audit --audit-level=moderate

  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        cache-dependency-path: './frontend/package-lock.json'

    - name: Install Dependencies
      working-directory: ./frontend
      run: npm ci

    - name: Typecheck
      working-directory: ./frontend
      run: npm run typecheck

    - name: Lint
      working-directory: ./frontend
      run: npm run lint

    - name: Build
      working-directory: ./frontend
      run: npm run build
